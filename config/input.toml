# Relative paths are resolved from this file's directory.
[input]
# CY name and container branch codes are resolved through terminal_branches.

[input.filters]
# All non-empty filters are combined with AND. Blank or commented values disable them.
# Insert cy terminal and branch id here
# SQL applies them in WHERE; CSV yard inputs and container output use the same scope.
# Column names are configured per dataset in sql_mapping.toml / csv_mapping.toml.
# terminal_branches resolves these IDs to BRANCH_CODE and BRANCH_NAME.
# Shifting reports require the selected reference to contain exactly one branch.
terminal_id = 1
branch_id = 2

[input.sources]
terminal_branches = "sql"
# Yard datasets select "csv" or "sql"; shifting_summary selects "xlsx", "csv" or "sql".
yard_blocks = "sql"
yard_planning = "sql"
removed_slots = "sql"
parameters = "sql"
existing_containers = "csv"
inbound_containers = "csv"
master_equipment = "csv"
equipment_history = "csv"
shifting_summary = "xlsx"

# CSV starts at its earliest scoped activity: daily = first 24 hours, weekly = first 7 days.
# SQL uses a rolling window ending at recording time: daily = last 24 hours,
# weekly = last 7 days. Source activity date text is interpreted as WIB.
# This does not infer ingestion completeness or automatically select older periods.
[shifting]
block_mapping_file = "shifting_block_mapping.toml"
period_granularity = "daily"
timezone = "Asia/Jakarta"

[shifting.activities]
lifting = [
    "Lift On Loading",
    "Lift On Relokasi",
    "Lift Off Receiving",
    "Lift Off Discharge",
]
shifting = [
    "Shifting Delivery",
    "Shifting Muat",
]

[csv]
mapping_file = "csv_mapping.toml"
# For shifting_summary = "csv", export the six unique columns documented in
# repository/shifting_csv_import.md. This is a raw activity CSV, not an XLSX summary.
# shifting_operations_file = "../data_CY219/shifting_operations.csv"
# Read the existing shifting/lifting workbook directly on every data load.
# Codes map to initial block assignments, not individual equipment.
# Observations mapped to absent blocks are omitted before count validation.
# Select the latest complete day before today in WIB; blank counts are not zero.
# Incomplete recent dates fall back to the preceding complete date.
shifting_workbook_file = "../data_CY219/Shifting_Report_Summary_2026-10_Daily_20261030091831.xlsx"
shifting_workbook_sheet = "Per Alat Daily"

[csv.files]
terminal_branches = "../data_CY219/_TRM_MST_TERMINAL_BRANCH.csv"
yard_blocks = "../data_CY219/_TRM_MST_YARD_BLOCK__202610141439.csv"
yard_planning = "../data_CY219/_TRM_TRS_YARD_PLANNING_ITEM__202610141445.csv"
removed_slots = "../data_CY219/removed_slots.csv"
parameters = "../data_CY219/_TRM_MST_YARD_PARAMETER__202610141443.csv"
existing_containers = "../data_CY219/_TRM_TRS_TARGET_CONTAINER__202610301612.csv"
inbound_containers = "../data_CY219/inbound.csv"
master_equipment = "../data_CY219/master_equipment.csv"
equipment_history = "../data_CY219/equipment_history.csv"

# Required when any input.sources entry is "sql".
# Set the named connection environment variables before running.
# Requires requirements-sql.txt and the named password environment variable.
[sql]
mapping_file = "sql_mapping.toml"
host_env = "YARD_DB_HOST"
port = 5432
dbname_env = "YARD_DB_NAME"
user_env = "YARD_DB_USER"
password_env = "YARD_DB_PASSWORD"
connect_timeout = 10
sslmode = "prefer"
schema = "TERMINAL_APP"
consistent_snapshot = true

[output]
containers_file = "../output/result.csv"
