# Relative paths are resolved from this file's directory.
[input]
# CY name and container branch codes are resolved through terminal_branches.

[input.filters]
# All non-empty filters are combined with AND. Blank or commented values disable them.
# Insert cy terminal and branch id here
# SQL applies them in WHERE; CSV yard inputs and container output use the same scope.
# Column names are configured per dataset in sql_mapping.toml / csv_mapping.toml.
# terminal_branches resolves these IDs to BRANCH_CODE and BRANCH_NAME.
# Shifting reports require the selected reference to contain exactly one branch.
terminal_id = 1
branch_id = 2

[shifting_period]
# Explicit alignment supplied by the user; Unix seconds, no timezone conversion.
# Applies to one report-year cycle. Update when week numbers reset for a new year.
benchmark_week = 40
benchmark_period_start = 1857916800

[input.sources]
terminal_branches = "sql"
# Each dataset independently selects "csv" or "sql".
yard_blocks = "sql"
yard_planning = "sql"
removed_slots = "sql"
parameters = "sql"
existing_containers = "sql"
inbound_containers = "csv"
master_equipment = "csv"
equipment_history = "csv"

[csv]
mapping_file = "csv_mapping.toml"
# Optional flat CSV for analysis; uncomment after supplying the file.
# Required headers: cy_name,shifting_code,lifting_count,shifting_count
# Legacy equipment_group header is also accepted instead of shifting_code.
# These codes identify initial block assignments, not individual equipment.
# Observations mapped to absent blocks are skipped and reported.
# All detail periods are loaded; weekly recording requires week_number (1-53).
# The recorder selects the latest week before validating operation counts.
# report_month identifies the report year and prevents mixing year cycles.
# A week_number of TOTAL is excluded. Repeated observations are retained.
# Counts must be non-negative integers or both blank for missing data.
shifting_summary_file = "../data_CY219/Shifting_Report_Summary_2026-10_Weekly_20261026020923.csv"
# When configured, regenerate the CSV from this workbook on every data load.
shifting_workbook_file = "../data_CY219/Shifting_Report_Summary_2026-10_Weekly_20261026020923.xlsx"
shifting_workbook_sheet = "Per Alat Weekly"
shifting_block_mapping_file = "shifting_block_mapping.toml"

[csv.files]
terminal_branches = "../data_CY219/_TRM_MST_TERMINAL_BRANCH.csv"
yard_blocks = "../data_CY219/_TRM_MST_YARD_BLOCK__202610141439.csv"
yard_planning = "../data_CY219/_TRM_TRS_YARD_PLANNING_ITEM__202610141445.csv"
removed_slots = "../data_CY219/removed_slots.csv"
parameters = "../data_CY219/_TRM_MST_YARD_PARAMETER__202610141443.csv"
existing_containers = "../data_CY219/containers.csv"
inbound_containers = "../data_CY219/inbound.csv"
master_equipment = "../data_CY219/master_equipment.csv"
equipment_history = "../data_CY219/equipment_history.csv"

# Required when any input.sources entry is "sql".
# Set the named connection environment variables before running.
# Requires requirements-sql.txt and the named password environment variable.
[sql]
mapping_file = "sql_mapping.toml"
host_env = "YARD_DB_HOST"
port = 5432
dbname_env = "YARD_DB_NAME"
user_env = "YARD_DB_USER"
password_env = "YARD_DB_PASSWORD"
connect_timeout = 10
sslmode = "prefer"
schema = "TERMINAL_APP"
consistent_snapshot = true

[output]
containers_file = "../output/result.csv"
