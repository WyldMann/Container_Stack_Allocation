# Inputs for main.py. Paths are relative to this file.
[input.filters]
# Select one branch code or a list of branches to simulate separately.
branch_code = ["JKT74"]

[input.sources]
# Each yard dataset can use "csv" or "sql".
terminal_branches = "csv"
yard_blocks = "csv"
yard_planning = "csv"
removed_slots = "csv"
parameters = "csv"
existing_containers = "csv"
inbound_containers = "csv"
master_equipment = "csv"
equipment_history = "csv"

[csv]
mapping_file = "csv_mapping.toml"

[csv.files]
terminal_branches = "../../data_container_stacking/terminal_branch.csv"
yard_blocks = "../../data_container_stacking/yard_block.csv"
yard_planning = "../../data_container_stacking/yard_planning.csv"
removed_slots = "../../data_container_stacking/removed_slots.csv"
parameters = "../../data_container_stacking/parameters.csv"
existing_containers = "../../data_container_stacking/containers.csv"
# Supply the current inbound export at this path.
inbound_containers = "../../data_container_stacking/inbound.csv"
master_equipment = "../../data_container_stacking/master_equipment.csv"
equipment_history = "../../data_container_stacking/equipment_history.csv"

# Required when any input.sources entry is "sql".
# Set the named environment variables and install requirements-sql.txt.
[sql]
mapping_file = "sql_mapping.toml"
host_env = "YARD_DB_HOST"
port = 5432
dbname_env = "YARD_DB_NAME"
user_env = "YARD_DB_USER"
password_env = "YARD_DB_PASSWORD"
connect_timeout = 10
sslmode = "prefer"
schema = "TERMINAL_APP"
consistent_snapshot = true

[output]
# A run with multiple branches appends each branch code to the file stem.
containers_file = "../../output/result.csv"
