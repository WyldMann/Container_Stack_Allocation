# Placement settings for main.py.
[feasibility]
# Enforce the existing pyramid stacking safety rule.
stacking_safety = true

# Loader modes: "feasibility" rejects, "heuristic" scores, and "off" skips.
# Current access covers the destination and occupied stacks. RTGs are exempt.
# Future access covers receiving options and must use the same or a weaker
# mode (off < heuristic < feasibility). Omit it to inherit the current mode.
loader_access_mode = "heuristic"
preserve_future_loader_access_mode = "heuristic"
# Exclude fully occupied stacks from current access protection.
ignore_full_stacks_for_loader_access = true


[heuristic]
# Disabled factors skip scoring and contribute a neutral multiplier of 1.
enable_delta_container_mass = true
enable_equipment_distance = false
enable_size_cluster = true

# Maximum mass-compatibility score, reached when the incoming
# container and the supporting top container have equal masses.
w_delta_container_mass = 10.0

# Positive container-mass difference at which the mass score halves.
# Difference = supporting top-container mass minus incoming mass.
# Uses the same units as the container data's weight field.
hl_delta_container_mass = 5000.0

# Maximum equipment-distance score, reached at zero distance.
w_equipment_distance = 10.0

# Equipment distance at which the distance score halves.
# Uses the grid-distance units calculated by the equipment model.
hl_equipment_distance = 5.0

# Fallback score when the incoming container is heavier than its
# support, or equipment distance is infinite. This is not a general
# lower bound on all scores.
min_value = 0.001

# Mass-compatibility score when either container's mass is unknown.
no_delta_container_mass_value = 0.1

# Maximum neighborhood distance considered for size clustering,
# measured between the closest footprint cells in grid units.
# Zero produces a neutral clustering multiplier.
size_cluster_radius = 1

# Neighbor distance at which its clustering contribution halves.
hl_size_cluster_distance = 0.5

# Positive smoothing value that pulls clustering towards neutral.
# Larger values reduce the influence of neighboring container sizes.
size_cluster_prior = 2.0

# Strength of the clustering reward for matching sizes and penalty
# for different sizes. Zero produces a neutral multiplier of 1.
size_cluster_bias = 2.0

# Current loader-access score multiplier for an unreachable destination (0 to 1).
loader_inaccessible_destination_multiplier = 0.25

# Current access score divides by 1 plus this weight per occupied location losing access.
loader_occupied_access_loss_weight = 1.0

# Future access score divides by 1 plus this weight per receiving option losing access.
loader_future_access_loss_weight = 1.0
