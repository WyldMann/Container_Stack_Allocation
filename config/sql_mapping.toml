# Mapping direction:
# INTERNAL_FIELD = "SQL column"
#
# Required and optional fields are determined by the reader's schema.
# Table/view names are inferred from the exports and must be verified.
# Names are quoted exactly, including capitalization. Each dataset may override
# schema and supply filters or order_by, referencing SQL source columns.
# filter_columns maps the shared values in input.toml [input.filters] to this table.
# branch_kind = "code" resolves a container or equipment BRANCH through terminal_branches.

[sql.terminal_branches]
schema = "TERMINAL_APP"
relation = "TRM_MST_TERMINAL_BRANCH"
filter_columns = { terminal_id = "TERMINAL_ID", branch_id = "BRANCH_ID" }

[sql.terminal_branches.columns]
branch_id = "BRANCH_ID"
terminal_id = "TERMINAL_ID"
branch_code = "BRANCH_CODE"
branch_name = "BRANCH_NAME"

[sql.yard_blocks]
relation = "TRM_MST_YARD_BLOCK"
filter_columns = { terminal_id = "TERMINAL_ID", branch_id = "BRANCH_ID" }

[sql.yard_blocks.columns]
block_id = "BLOCK_ID"
branch_id = "BRANCH_ID"
block_code = "BLOCK_CODE"
row_count = "ROW_COUNT"
slot_count = "SLOT_COUNT"
max_tier = "MAX_TIER"
pos_x = "POS_X"
pos_y = "POS_Y"


[sql.yard_planning]
relation = "TRM_TRS_YARD_PLANNING_ITEM"
filter_columns = { terminal_id = "TERMINAL_ID", branch_id = "BRANCH_ID" }

[sql.yard_planning.columns]
parameter_id = "PARAM_ID"
block_id = "BLOCK_ID"
row_no = "ROW"
slot_no = "SLOT"


[sql.removed_slots]
relation = "TRM_MST_YARD_BLOCK_REMOVED_SLOT"

[sql.removed_slots.columns]
block_id = "BLOCK_ID"
row_no = "ROW_NO"
slot_no = "SLOT_NO"


[sql.parameters]
relation = "TRM_MST_YARD_PARAMETER"
filter_columns = { terminal_id = "TERMINAL_ID", branch_id = "BRANCH_ID" }

[sql.parameters.columns]
parameter_id = "PARAM_ID"
parameter_name = "PARAM_NAME"
principal = "PRINCIPAL"
principal_score = "PRINCIPAL_SCORE"
container_condition = "CONT_CONDITION"
container_condition_score = "CONT_CONDITION_SCORE"
container_fill = "CONT_FILL"
container_fill_score = "CONT_FILL_SCORE"
operation_type = "OPERATION_TYPE"
operation_type_score = "OPERATION_TYPE_SCORE"
container_size = "CONT_SIZE"
container_size_score = "CONT_SIZE_SCORE"
container_grade = "CONT_GRADE"
container_grade_score = "CONT_GRADE_SCORE"
pol = "POL"
pod = "POD"
route_score = "ROUTE_SCORE"
vessel = "VESSEL"
voyage = "VOYAGE"
vessel_voyage_score = "VESSEL_VOYAGE_SCORE"
weight_start = "WEIGHT_START"
weight_end = "WEIGHT_END"
weight_range_score = "WEIGHT_RANGE_SCORE"
and_score = "AND_SCORE"


[sql.existing_containers]
relation = "TRM_TRS_TARGET_CONTAINER"
schema = "TERMINAL_APP"
branch_kind = "code"

[sql.existing_containers.columns]
container_id = "CONTNO"
branch_id = "BRANCH"
block_code = "BLOK"
row_no = "ROW"
slot_no = "SLOT"
tier_no = "TIER"
principal = "PRINCIPAL"
container_condition = "DMG_FLAG"
container_fill = "FULLMT"
container_size = "CONTSIZE"
container_grade = "CONT_GRADE"
pol = "POL"
pod = "POD"
vessel = "VESSEL"
voyage = "VOYAGE"
weight = "WEIGHT"
move_time = "MOVE_TIME"
operation_type = "OPERATION_TYPE"
pot = "POT"
vessel_operator = "VESSEL_OPERATOR"


[sql.inbound_containers]
branch_kind = "code"
relation = "inbound"
order_by = ["MOVE_TIME", "CONTNO"]

[sql.inbound_containers.columns]
container_id = "CONTNO"
principal = "PRINCIPAL"
container_condition = "DMG_FLAG"
container_fill = "FULLMT"
container_size = "CONTSIZE"
container_grade = "CONT_GRADE"
pol = "POL"
pod = "POD"
vessel = "VESSEL"
voyage = "VOYAGE"
weight = "WEIGHT"
move_time = "MOVE_TIME"
branch_id = "BRANCH"
block_code = "BLOK"
row_no = "ROW"
slot_no = "SLOT"
tier_no = "TIER"
operation_type = "OPERATION_TYPE"
pot = "POT"
vessel_operator = "VESSEL_OPERATOR"


[sql.master_equipment]
relation = "master_equipment"

[sql.master_equipment.columns]
equipment_code = "EQUIPMENT_CODE"
equipment_type = "EQUIPMENT_TYPE"


[sql.equipment_history]
branch_kind = "code"
relation = "equipment_history"

[sql.equipment_history.columns]
equipment_code = "ALAT"
branch_id = "BRANCH"
block_code = "BLOK"
row_no = "ROW"
slot_no = "SLOT"
move_time = "MOVE_DATE"

# SQL operations mapping, counted separately for lifting and shifting per ALAT.
# Verify the reporting relation names exactly, including TLB and MAPPIN.
# Reuse the existing SQL connection when REPORT is in the same database.
# Resolve KODE_CABANG from the selected terminal_branches.BRANCH_CODE.
# Filter ALAT to equipment codes mapped to accepted yard blocks, and return
# separate lifting and shifting counts per equipment code for the chosen period.
# Interpret source date text as WIB using shifting.timezone.

[sql.shifting_summary]
schema = "REPORT"
detail_relation = "TBL_INSP_MAPPING_MSA_RECEIVINGDELIVERY_DTL"
header_relation = "TBL_INSP_MAPPING_MSA_RECEIVINGDELIVERY_HDR"
datetime_format = "DD-MM-YYYY HH24:MI"

[sql.shifting_summary.detail_columns]
operation_id = "DTL_ID"
document_id = "DOC_ID"
activity = "ACTIVITY"
activity_time = "ACTIVITY_DATE_TIME"

[sql.shifting_summary.header_columns]
document_id = "DOC_ID"
branch_code = "KODE_CABANG"
equipment_code = "ALAT"
