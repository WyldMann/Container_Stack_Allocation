# Inputs for shifting_report_calculation.py. Paths are relative to this file.
[input]
# CY name and container branch codes are resolved through terminal_branches.

[input.filters]
# Select branch codes, ignoring case and surrounding whitespace.
# A single string is also accepted; blank or omitted strings disable scoping.
# terminal_branches resolves each code to its IDs and its own BRANCH_NAME.
# Each branch is analyzed separately and appended to its own metrics JSONL.
branch_code = ["JKT64","JKT74"]

[input.sources]
terminal_branches = "csv"
# Yard datasets select "csv" or "sql"; shifting_summary selects "xlsx", "csv" or "sql".
yard_blocks = "csv"
yard_planning = "csv"
removed_slots = "csv"
parameters = "csv"
existing_containers = "csv"
master_equipment = "csv"
equipment_history = "csv"
shifting_summary = "csv"

# CSV ends at its latest scoped activity: daily = preceding 24 hours, weekly = preceding 7 days.
# SQL uses a rolling window ending at recording time: daily = last 24 hours,
# weekly = last 7 days. Source activity date text is interpreted as WIB.
# This does not infer ingestion completeness or automatically select older periods.
[shifting]
block_mapping_file = "shifting_block_mapping.toml"
period_granularity = "daily"
timezone = "Asia/Jakarta"

[shifting.activities]
lifting = [
    "Lift On Loading",
    "Lift On Relokasi",
    "Lift Off Receiving",
    "Lift Off Discharge",
    "Lift On Delivery",
]
shifting = [
    "Shifting Delivery",
    "Shifting Muat",
    "Shifting",
]

[csv]
mapping_file = "csv_mapping.toml"
# XLSX-only settings: uncomment when input.sources.shifting_summary = "xlsx".
# CSV operations use csv.files.shifting_summary below; no worksheet is needed.
# Codes map to initial block assignments, not individual equipment.
# Observations mapped to absent blocks are omitted before count validation.
# Select the latest complete day before today in WIB; blank counts are not zero.
# Incomplete recent dates fall back to the preceding complete date.
# shifting_workbook_file = "../../data_shifting_calculation/Shifting_Report_Summary_2026-10_Daily_20261030091831.xlsx"
# shifting_workbook_sheet = "Per Alat Daily"

[csv.files]
terminal_branches = "../../data_shifting_calculation/terminal_branch.csv"
yard_blocks = "../../data_shifting_calculation/yard_block.csv"
yard_planning = "../../data_shifting_calculation/yard_planning.csv"
removed_slots = "../../data_shifting_calculation/removed_slots.csv"
parameters = "../../data_shifting_calculation/parameters.csv"
existing_containers = "../../data_shifting_calculation/containers.csv"
master_equipment = "../../data_shifting_calculation/master_equipment.csv"
equipment_history = "../../data_shifting_calculation/equipment_history.csv"
# Raw activities with unique headers; see repository/shifting_csv_import.md.
shifting_summary = "../../data_shifting_calculation/shifting_report.csv"

# Required when any input.sources entry is "sql".
# Set the named connection environment variables before running.
# Requires requirements-sql.txt and the named password environment variable.
[sql]
mapping_file = "sql_mapping.toml"
host_env = "YARD_DB_HOST"
port = 5432
dbname_env = "YARD_DB_NAME"
user_env = "YARD_DB_USER"
password_env = "YARD_DB_PASSWORD"
connect_timeout = 10
sslmode = "prefer"
schema = "TERMINAL_APP"
consistent_snapshot = true
